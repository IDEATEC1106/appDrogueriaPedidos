name: Compilar APK Flet

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet requests certifi

    - name: Pre-accept Android Licenses
      run: |
        mkdir -p /home/runner/.android
        echo -n -e "\n89333560a301477bdab1ff6fcdcd25bc7ba3b8f6\n" > /home/runner/.android/sdk-license
        echo -n -e "\n24333f1a63bf966934257921a221f24e931e05fc\n" >> /home/runner/.android/sdk-license
        echo -n -e "\nd56f5187479451eabf01fb78af6dfcb131a648b0\n" >> /home/runner/.android/sdk-license

    - name: Build APK with Flet
      run: |
        echo "y" | flet build apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pedidos-drogueria-apk
        path: build/apk/*.apk
