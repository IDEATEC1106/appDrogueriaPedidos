name: Compilar APK Flet

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet requests certifi

    - name: Build APK with Flet
      run: |
        # Ejecutamos flet en segundo plano o dejamos que cree el entorno, 
        # y luego aceptamos las licencias en el directorio donde Flutter fue instalado:
        flet build apk &
        FLET_PID=$!
        
        # Esperamos a que descargue el entorno e instale el SDK interno
        sleep 40
        
        # Localizamos el flutter interno y aceptamos licencias forzosamente
        FLUTTER_BIN=$(find /home/runner/.flet -name "flutter" -type f 2>/dev/null | head -n 1)
        if [ -n "$FLUTTER_BIN" ]; then
          yes | "$FLUTTER_BIN" doctor --android-licenses || true
        fi
        
        # Esperamos a que termine el proceso de compilación
        wait $FLET_PID

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pedidos-drogueria-apk
        path: build/apk/*.apk
