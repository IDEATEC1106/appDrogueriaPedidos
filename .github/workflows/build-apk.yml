name: Compilar APK Flet

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet requests certifi

    - name: Build APK with Flet and Accept Licenses
      run: |
        # 1. Iniciamos la compilación en segundo plano
        flet build apk --yes &
        FLET_PID=$!

        # 2. Esperamos a que Flet descargue su SDK interno de Flutter
        sleep 45

        # 3. Localizamos el Flutter interno y aceptamos las licencias de Android a la fuerza
        FLUTTER_BIN=$(find /home/runner/.flet -name "flutter" -type f 2>/dev/null | head -n 1)
        if [ -n "$FLUTTER_BIN" ]; then
          echo "Aplicando licencias en: $FLUTTER_BIN"
          yes | "$FLUTTER_BIN" doctor --android-licenses || true
        fi

        # 4. Esperamos a que la compilación termine con éxito
        wait $FLET_PID

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pedidos-drogueria-apk
        path: build/apk/*.apk
