name: Compilar APK Flet

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Java (Android requirement)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet requests certifi

    - name: Build APK with Flet
      run: |
        # Forzamos la aceptación de licencias de Android y ejecutamos la compilación
        export ANDROID_HOME=$HOME/Android/Sdk
        mkdir -p /home/runner/.android
        touch /home/runner/.android/repositories.cfg
        
        # Lanzamos flet build apk apuntando a android únicamente
        flet build apk --verbose

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pedidos-drogueria-apk
        path: build/apk/*.apk
