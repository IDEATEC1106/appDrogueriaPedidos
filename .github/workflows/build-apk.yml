name: Compilar APK Flet

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet requests certifi

    - name: Pre-download Flet Environment & Accept Android Licenses
      run: |
        # 1. Forzamos una ejecución inicial para que Flet descargue su SDK de Flutter en build/flutter
        flet build apk --yes || true

        # 2. Como el Flutter de Flet ya está en build/flutter, le aplicamos las licencias de Android directamente ahí
        if [ -f "build/flutter/bin/flutter" ]; then
          echo "Aplicando licencias al Flutter local de Flet..."
          yes | build/flutter/bin/flutter doctor --android-licenses || true
        fi

    - name: Build APK Final
      run: |
        flet build apk --yes

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pedidos-drogueria-apk
        path: build/apk/*.apk
