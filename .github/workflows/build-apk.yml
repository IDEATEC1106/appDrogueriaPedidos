name: Compilar APK Flet

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet requests certifi

    - name: Build APK with Flet
      run: |
        # 1. Lanzamos flet build apk en segundo plano para que descargue su entorno interno
        echo "y" | flet build apk &
        FLET_PID=$!

        # 2. Esperamos a que el SDK interno de Flutter e infraestructura de Flet estén listos
        sleep 50

        # 3. Localizamos el ejecutable de flutter interno de Flet y aceptamos las licencias de Android a la fuerza
        FLUTTER_BIN=$(find /home/runner/.flet -name "flutter" -type f 2>/dev/null | head -n 1)
        if [ -n "$FLUTTER_BIN" ]; then
          echo "Flutter interno encontrado en: $FLUTTER_BIN"
          yes | "$FLUTTER_BIN" doctor --android-licenses || true
        fi

        # 4. Esperamos a que finalice el proceso de compilación del APK
        wait $FLET_PID

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pedidos-drogueria-apk
        path: build/apk/*.apk
