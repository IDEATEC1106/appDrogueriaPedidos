name: Compilar APK Flet

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Java (Android requirement)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Flet and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet requests certifi

    - name: Build APK with Flet
      run: |
        # 1. Ejecutamos flet build una vez para que descargue e instale su Flutter interno de manera limpia
        flet build apk || true

        # 2. Localizamos dónde se instaló el Flutter interno de Flet y aceptamos todas las licencias de Android de golpe
        FLUTTER_BIN=$(find /home/runner/.flet -name "flutter" -type f 2>/dev/null | head -n 1)
        if [ -n "$FLUTTER_BIN" ]; then
          echo "Aceptando licencias en: $FLUTTER_BIN"
          yes | "$FLUTTER_BIN" doctor --android-licenses || true
        fi

        # 3. Volvemos a lanzar la compilación; ahora con las licencias aceptadas terminará con éxito
        flet build apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pedidos-drogueria-apk
        path: build/apk/*.apk
